name: dependencies-weekly

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - run: flutter pub get
      - name: List outdated packages
        run: |
          {
            echo 'Weekly `flutter pub outdated` report (generated by CI).'
            echo
            echo '```'
            flutter pub outdated --no-dev-dependencies --show-all || true
            echo '```'
            echo
            echo 'Dev dependencies:'
            echo '```'
            flutter pub outdated --dev-dependencies || true
            echo '```'
          } > outdated.md
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly dependency report"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file outdated.md
          else
            gh issue create --title "$title" --body-file outdated.md
          fi
